spring:
  application:
    name: url-shortener
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: "10s"

  datasource:
    url: 'jdbc:h2:mem:url-shortener-db'
    driverClassName: 'org.h2.Driver'
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: '/h2-console'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    database-platform: 'org.hibernate.dialect.H2Dialect'

springdoc:
  model-and-view-allowed: true

management:
  endpoints:
    web:
      exposure:
        include: health